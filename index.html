<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jugar</title>

<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jugar">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#6b5aa0">

<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }

  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    touch-action: none;
    height: 100%;
    width: 100%;
    background: linear-gradient(160deg, #8b7ab8 0%, #6b5aa0 45%, #5a4a8f 100%);
    font-family: sans-serif;
  }

  #cargando {
    position: fixed;
    inset: 0;
    color: #fff;
    text-align: center;
    padding-top: 40vh;
    z-index: 999;
  }

  /* ============== CONSOLA (contenedor completo) ============== */
  #consola {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3vh 4vw 2vh;
  }

  /* Fila superior: luz + logo */
  #fila-top {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 2vw 1.5vh;
  }
  #power-luz {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff3b30;
    box-shadow: 0 0 5px #ff3b30;
    flex-shrink: 0;
  }
  #power-texto {
    color: #ddd;
    font-size: 9px;
    letter-spacing: 1px;
  }

  /* ============== BISEL / PANTALLA ============== */
  #bisel {
    width: 84vw;
    max-width: 420px;
    aspect-ratio: 10 / 10.4;
    background: #141414;
    border-radius: 16px;
    box-shadow: inset 0 0 0 2px #000, 0 6px 14px rgba(0,0,0,0.45);
    padding: 3%;
    display: flex;
    flex-direction: column;
  }
  #game-wrap {
    flex: 1;
    position: relative;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
  }
  #game {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Logo GAME BOY COLOR */
  #logo {
    text-align: center;
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: bold;
    font-size: clamp(15px, 4.5vw, 22px);
    color: #fff;
    margin: 1.6vh 0 1vh;
  }
  #logo .color { color: #f4c542; }

  /* Pastilla Nintendo */
  #nintendo {
    border: 2px solid #4a3d7a;
    border-radius: 20px;
    padding: 3px 22px;
    color: #4a3d7a;
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: bold;
    font-size: clamp(10px, 3vw, 13px);
    margin-bottom: 2vh;
  }

  /* ============== PANEL DE CONTROLES (nuestro, no el de EmulatorJS) ============== */
  #controles {
    width: 100%;
    max-width: 460px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  #fila-controles {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2vw;
  }

  /* D-pad */
  #dpad {
    position: relative;
    width: 128px;
    height: 128px;
    flex-shrink: 0;
  }
  .dpad-btn {
    position: absolute;
    background: #4a4560;
    box-shadow: 0 3px 4px rgba(0,0,0,0.4);
  }
  .dpad-btn:active { background: #3a3550; }
  .dpad-btn.up    { top: 0;    left: 44px; width: 40px; height: 44px; border-radius: 6px 6px 0 0; }
  .dpad-btn.down  { bottom: 0; left: 44px; width: 40px; height: 44px; border-radius: 0 0 6px 6px; }
  .dpad-btn.left  { top: 44px; left: 0;    width: 44px; height: 40px; border-radius: 6px 0 0 6px; }
  .dpad-btn.right { top: 44px; right: 0;   width: 44px; height: 40px; border-radius: 0 6px 6px 0; }
  .dpad-btn.centro{ top: 44px; left: 44px; width: 40px; height: 40px; background: #4a4560; }
  .dpad-arrow {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2a2540;
    font-size: 16px;
    pointer-events: none;
  }

  /* A / B */
  #ab-group {
    position: relative;
    width: 130px;
    height: 90px;
    flex-shrink: 0;
  }
  .btn-redondo {
    position: absolute;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4a4560, #2a2540);
    box-shadow: 0 3px 5px rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9a93b5;
    font-weight: bold;
    font-size: 18px;
  }
  .btn-redondo:active { filter: brightness(0.85); }
  #btn-a { top: 0;  right: 0; }
  #btn-b { top: 34px; left: 0; }

  /* Start / Select */
  #fila-start-select {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 2vh;
  }
  .grupo-pastilla { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .btn-pastilla {
    width: 46px;
    height: 16px;
    border-radius: 10px;
    background: #4a4560;
    box-shadow: 0 2px 3px rgba(0,0,0,0.4);
    transform: rotate(-20deg);
  }
  .btn-pastilla:active { filter: brightness(0.85); }
  .etiqueta-pastilla {
    color: #d8d4e8;
    font-size: 9px;
    letter-spacing: 1px;
  }

  /* Altavoz decorativo */
  #altavoz {
    align-self: flex-end;
    margin-top: -30px;
    margin-right: 4vw;
    width: 60px;
    aspect-ratio: 1;
    background-image: radial-gradient(#4a3d7a 30%, transparent 31%);
    background-size: 22% 22%;
    opacity: 0.55;
  }

  /* Ocultamos por completo el gamepad virtual nativo de EmulatorJS:
     nosotros ya dibujamos el nuestro arriba. */
  [id*="ejs_gamepad"] { display: none !important; }
</style>
</head>
<body>

<div id="cargando">Cargando emulador...</div>

<div id="consola">

  <div id="fila-top">
    <div id="power-luz"></div>
    <div id="power-texto">POWER</div>
  </div>

  <div id="bisel">
    <div id="game-wrap">
      <div id="game"></div>
    </div>
  </div>

  <div id="logo">GAME BOY <span class="color">COLOR</span></div>
  <div id="nintendo">Nintendo</div>

  <div id="controles">
    <div id="fila-controles">
      <div id="dpad">
        <div class="dpad-btn centro"></div>
        <div class="dpad-btn up"    data-key="ArrowUp"><span class="dpad-arrow">▲</span></div>
        <div class="dpad-btn down"  data-key="ArrowDown"><span class="dpad-arrow">▼</span></div>
        <div class="dpad-btn left"  data-key="ArrowLeft"><span class="dpad-arrow">◀</span></div>
        <div class="dpad-btn right" data-key="ArrowRight"><span class="dpad-arrow">▶</span></div>
      </div>

      <div id="altavoz"></div>

      <div id="ab-group">
        <div class="btn-redondo" id="btn-a" data-key="x">A</div>
        <div class="btn-redondo" id="btn-b" data-key="z">B</div>
      </div>
    </div>

    <div id="fila-start-select">
      <div class="grupo-pastilla">
        <div class="btn-pastilla" data-key="v"></div>
        <div class="etiqueta-pastilla">SELECT</div>
      </div>
      <div class="grupo-pastilla">
        <div class="btn-pastilla" data-key="Enter"></div>
        <div class="etiqueta-pastilla">START</div>
      </div>
    </div>
  </div>

</div>

<script>
  // ---------------------------------------------------------
  // 1) Selección de juego según parámetro en la URL
  // ---------------------------------------------------------
  const params = new URLSearchParams(window.location.search);
  const juegoId = params.get('id') || 'demo';

  const juegos = {
    demo: { rom: 'roms/demo.gbc', core: 'gambatte', nombre: 'Juego Demo' },
    // pokemon: { rom: 'roms/pokemon.gbc', core: 'gambatte', nombre: 'Pokemon' },
  };

  const juego = juegos[juegoId] || juegos['demo'];
  document.title = juego.nombre;

  // ---------------------------------------------------------
  // 2) Configuración de EmulatorJS
  //    Ocultamos su gamepad virtual (CSS) porque usamos el nuestro.
  // ---------------------------------------------------------
  window.EJS_player = '#game';
  window.EJS_gameName = juego.nombre;
  window.EJS_biosUrl = '';
  window.EJS_gameUrl = juego.rom;
  window.EJS_core = juego.core;
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_backgroundColor = '#000000';
  window.EJS_startButtonName = 'Toca para jugar';
  window.EJS_alignStartButton = 'center';
  window.EJS_color = '#6b5aa0';
  window.EJS_Buttons = { gamepad: false }; // no mostrar el ícono de "activar gamepad"

  document.getElementById('cargando').remove();

  // ---------------------------------------------------------
  // 3) Nuestros propios botones táctiles → simulan teclado
  //    (mapeo por defecto de EmulatorJS: flechas, x=A, z=B,
  //     Enter=Start, v=Select)
  // ---------------------------------------------------------
  function simularTecla(tipo, key) {
    const evento = new KeyboardEvent(tipo, { key: key, bubbles: true });
    document.dispatchEvent(evento);
  }

  document.querySelectorAll('[data-key]').forEach(function (el) {
    const key = el.getAttribute('data-key');

    el.addEventListener('touchstart', function (e) {
      e.preventDefault();
      simularTecla('keydown', key);
    }, { passive: false });

    el.addEventListener('touchend', function (e) {
      e.preventDefault();
      simularTecla('keyup', key);
    }, { passive: false });

    // También con mouse, útil para probar en PC
    el.addEventListener('mousedown', function () { simularTecla('keydown', key); });
    el.addEventListener('mouseup',   function () { simularTecla('keyup', key); });
  });
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.log('Service worker no registrado:', err);
    });
  }
</script>

</body>
</html>
