<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jugar</title>

<!-- PWA: manifest -->
<link rel="manifest" href="manifest.json">

<!-- PWA: iOS (Safari no lee bien manifest.json, necesita estas tags aparte) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jugar">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- PWA: Android/Chrome -->
<meta name="theme-color" content="#6b5b95">
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    touch-action: none;
    height: 100%;
    width: 100%;
    /* Cuerpo morado tipo Game Boy Color */
    background: linear-gradient(160deg, #8b7ab8 0%, #6b5aa0 40%, #5a4a8f 100%);
  }

  #cargando {
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    padding-top: 40vh;
  }

  /* -----------------------------------------------------------
     CARCASA DECORATIVA (fondo, no interactiva)
     Se dibuja detrás de todo con z-index bajo. pointer-events:none
     para que los toques pasen a través hacia los controles reales.
     ----------------------------------------------------------- */
  #carcasa {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* Bisel negro de la pantalla, en la parte superior */
  #bisel {
    position: absolute;
    top: 4%;
    left: 8%;
    right: 8%;
    height: 40%;
    background: #1a1a1a;
    border-radius: 18px;
    box-shadow: inset 0 0 0 2px #000, 0 4px 10px rgba(0,0,0,0.4);
  }

  /* Luz de power */
  #power-luz {
    position: absolute;
    top: 6%;
    left: 12%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff3b30;
    box-shadow: 0 0 6px #ff3b30;
  }
  #power-texto {
    position: absolute;
    top: 9.5%;
    left: 8%;
    color: #ddd;
    font-family: sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
  }

  /* Logo estilo "GAME BOY COLOR" */
  #logo {
    position: absolute;
    top: 45.5%;
    left: 0;
    right: 0;
    text-align: center;
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: bold;
    font-size: clamp(16px, 5vw, 26px);
    color: #fff;
  }
  #logo .color { color: #f4c542; }

  /* Pastilla "Nintendo" */
  #nintendo {
    position: absolute;
    top: 53%;
    left: 50%;
    transform: translateX(-50%);
    width: 34%;
    height: 4.5%;
    border: 2px solid #4a3d7a;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4a3d7a;
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: bold;
    font-size: clamp(10px, 3vw, 14px);
  }

  /* Rejilla de altavoz */
  #altavoz {
    position: absolute;
    bottom: 4%;
    right: 8%;
    width: 15%;
    aspect-ratio: 1;
    background-image: radial-gradient(#4a3d7a 30%, transparent 31%);
    background-size: 20% 20%;
    opacity: 0.6;
  }

  /* Textos decorativos SELECT / START (los botones reales van encima) */
  .etiqueta-decorativa {
    position: absolute;
    bottom: 5.5%;
    color: #4a3d7a;
    font-family: sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    text-align: center;
    width: 60px;
  }
  #etiqueta-select { left: 26%; }
  #etiqueta-start  { left: 42%; }

  /* -----------------------------------------------------------
     Contenedor real del emulador (EJS_player).
     Ocupa toda la pantalla; el propio EmulatorJS centra el
     canvas del juego dentro del área del bisel gracias a que
     coincide en proporción. Los controles táctiles van encima.
     ----------------------------------------------------------- */
  #game {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 1;
    background: transparent !important;
  }

  /* -----------------------------------------------------------
     Restyle de los botones táctiles para que combinen con la carcasa
     ----------------------------------------------------------- */
  [id*="ejs_gamepad_a"] {
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #1a1a1a) !important;
    border: 2px solid #000 !important;
    border-radius: 50% !important;
    color: #999 !important;
    box-shadow: 0 3px 4px rgba(0,0,0,0.5) !important;
  }
  [id*="ejs_gamepad_b"] {
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #1a1a1a) !important;
    border: 2px solid #000 !important;
    border-radius: 50% !important;
    color: #999 !important;
    box-shadow: 0 3px 4px rgba(0,0,0,0.5) !important;
  }
  [id*="ejs_gamepad_start"],
  [id*="ejs_gamepad_select"] {
    background: #1a1a1a !important;
    border: 1px solid #000 !important;
    border-radius: 12px !important;
    color: transparent !important; /* el texto real lo da la etiqueta decorativa */
    box-shadow: 0 2px 3px rgba(0,0,0,0.5) !important;
  }
  [id*="ejs_gamepad_dpad"] {
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.5));
  }
</style>
</head>
<body>

<div id="cargando">Cargando emulador...</div>

<!-- Carcasa decorativa -->
<div id="carcasa">
  <div id="bisel"></div>
  <div id="power-luz"></div>
  <div id="power-texto">POWER</div>
  <div id="logo">GAME BOY <span class="color">COLOR</span></div>
  <div id="nintendo">Nintendo</div>
  <div id="altavoz"></div>
  <div class="etiqueta-decorativa" id="etiqueta-select">SELECT</div>
  <div class="etiqueta-decorativa" id="etiqueta-start">START</div>
</div>

<div id="game"></div>

<script>
  // ---------------------------------------------------------
  // CONFIGURACIÓN QUE DEBES AJUSTAR TÚ:
  // ---------------------------------------------------------

  // 1) Selección de juego según parámetro en la URL
  //    Ej: tusitio.com/jugar.html?id=pokemon
  const params = new URLSearchParams(window.location.search);
  const juegoId = params.get('id') || 'demo';

  // 2) Mapa de juegos: id -> ruta de la ROM
  //    Sube tus ROMs a tu propio hosting (mismo servidor, carpeta /roms/)
  const juegos = {
    demo:    { rom: 'roms/demo.gbc',    core: 'gambatte', nombre: 'Juego Demo' },
    // pokemon: { rom: 'roms/pokemon.gbc', core: 'gambatte', nombre: 'Pokemon' },
    // otro:    { rom: 'roms/otro.gbc',    core: 'gambatte', nombre: 'Otro juego' },
  };

  const juego = juegos[juegoId] || juegos['demo'];
  document.title = juego.nombre;

  // ---------------------------------------------------------
  // CONFIGURACIÓN DE EMULATORJS
  // ---------------------------------------------------------
  window.EJS_player = '#game';
  window.EJS_gameName = juego.nombre;
  window.EJS_biosUrl = '';
  window.EJS_gameUrl = juego.rom;
  window.EJS_core = juego.core; // 'gambatte' = Game Boy Color
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_backgroundColor = 'transparent';
  window.EJS_startButtonName = 'Toca para jugar';
  window.EJS_alignStartButton = 'center';
  window.EJS_color = '#6b5aa0';

  // IMPORTANTE: no forzamos autoarranque (EJS_startOnLoaded).
  // El navegador bloquea el audio hasta que hay un toque real del usuario,
  // así que dejamos que EmulatorJS muestre su botón de inicio propio.

  // Layout de botones táctiles: dpad + A/B + Start/Select.
  // input_value: 0=A, 8=B, 2=Select, 3=Start, 4-7=dpad
  window.EJS_VirtualGamepadSettings = [
    { type: "dpad", location: "left", left: "18%", top: "68%", joystickInput: false, inputValues: [4, 5, 6, 7] },

    { type: "button", text: "A", id: "a", location: "right", left: 78, top: 55, bold: true, input_value: 0 },
    { type: "button", text: "B", id: "b", location: "right", left: 35, top: 68, bold: true, input_value: 8 },

    { type: "button", text: "Select", id: "select", location: "center", left: -22, top: 87, fontSize: 10, input_value: 2 },
    { type: "button", text: "Start",  id: "start",  location: "center", left: 12,  top: 87, fontSize: 10, input_value: 3 }
  ];

  document.getElementById('cargando').remove();
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

<script>
  // Registrar service worker (necesario para que Chrome/Android ofrezca "instalar")
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.log('Service worker no registrado:', err);
    });
  }
</script>

</body>
</html>
