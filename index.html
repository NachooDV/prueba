<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jugar</title>

<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jugar">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#6b5aa0">

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    touch-action: none;
    height: 100%;
    width: 100%;
  }
  #game {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;       /* fallback */
    height: 100dvh;      /* alto real visible en móviles */
  }
  #cargando {
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    padding-top: 40vh;
  }

  /* -----------------------------------------------------------
     Solo ESTILO visual sobre los botones NATIVOS de EmulatorJS.
     No los ocultamos ni reemplazamos: seguimos usando su sistema
     real (EJS_VirtualGamepadSettings), así garantizamos que el
     click de "descargar juego" y todo lo demás sigue intacto.
     ----------------------------------------------------------- */
  [class~="b_a"],
  [class~="b_b"] {
    background: radial-gradient(circle at 35% 30%, #8b3a4a, #5e2230) !important;
    border: 2px solid #3a1620 !important;
    border-radius: 50% !important;
    color: #f0d8dc !important;
    font-weight: bold !important;
    box-shadow: 0 3px 5px rgba(0,0,0,0.5) !important;
  }
  [class~="b_start"],
  [class~="b_select"] {
    background: #6e6a63 !important;
    border: 1px solid #3f3c37 !important;
    border-radius: 14px !important;
    color: #d8d4c8 !important;
    box-shadow: 0 2px 3px rgba(0,0,0,0.5) !important;
  }
  .ejs_dpad_main,
  .ejs_dpad_vertical,
  .ejs_dpad_horizontal {
    filter: brightness(0.75) saturate(0.3) !important;
  }
  .ejs_parent {
    background: transparent !important;
  }

  /* -----------------------------------------------------------
     Imagen de fondo SOLO en la zona inferior (botones), sin tocar
     la zona de la pantalla del juego. Es una capa aparte, detrás
     de todo, que no intercepta toques (pointer-events: none).
     Ajusta "height" para cubrir justo hasta donde empiezan tus
     botones (bájalo/súbelo según cómo se vea).
     ----------------------------------------------------------- */
  #fondo-controles {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 41vh;   /* <-- ajusta este valor a ojo 45*/ 
    background-image: url('fondo.jpg');
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    /* sin z-index: al no tener valor explícito, queda debajo de
       los botones (que también son "auto") por estar antes en el HTML */
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="cargando">Cargando emulador...</div>
<div id="fondo-controles"></div>
<div id="game"></div>

<script>
  // ---------------------------------------------------------
  // 1) Selección de juego según parámetro en la URL
  // ---------------------------------------------------------
  const params = new URLSearchParams(window.location.search);
  const juegoId = params.get('id') || 'demo';

  const juegos = {
    demo: { rom: 'roms/demo.gbc', core: 'gambatte', nombre: 'Juego Demo' },
    // pokemon: { rom: 'roms/pokemon.gbc', core: 'gambatte', nombre: 'Pokemon' },
  };

  const juego = juegos[juegoId] || juegos['demo'];
  document.title = juego.nombre;

  // ---------------------------------------------------------
  // 2) Configuración de EmulatorJS
  // ---------------------------------------------------------
  window.EJS_player = '#game';
  window.EJS_gameName = juego.nombre;
  window.EJS_biosUrl = '';
  window.EJS_gameUrl = juego.rom;
  window.EJS_core = juego.core;
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_backgroundColor = '#000000';
  window.EJS_startButtonName = 'Toca para jugar';
  window.EJS_alignStartButton = 'center';
  window.EJS_color = '#6e6a63';

  // No forzamos autoarranque: EmulatorJS muestra su propio botón de
  // inicio, necesario para desbloquear audio con un toque real.

  // Nuestro propio layout de botones (input_value: 0=A, 8=B, 2=Select, 3=Start, 4-7=dpad)
  window.EJS_VirtualGamepadSettings = [
    { type: "dpad", location: "left", left: "30%", top: "60%", joystickInput: false, inputValues: [4, 5, 6, 7] }, //25 left

    { type: "button", text: "A", id: "a", location: "right", left: 78, top: 25, bold: true, input_value: 8 },
    { type: "button", text: "B", id: "b", location: "right", left: 10, top: 43, bold: true, input_value: 0 },

    { type: "button", text: "Select", id: "select", location: "center", left: 10, top: 10, fontSize: 11, input_value: 2 }, // left -22 35top
    { type: "button", text: "Start",  id: "start",  location: "center", left: 70,  top: 10, fontSize: 11, input_value: 3 } //left 50
  ];

  document.getElementById('cargando').remove();
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
