<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jugar</title>

<!-- PWA: manifest -->
<link rel="manifest" href="manifest.json">

<!-- PWA: iOS (Safari no lee bien manifest.json, necesita estas tags aparte) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jugar">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- PWA: Android/Chrome -->
<meta name="theme-color" content="#000000">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    touch-action: none;
    height: 100%;
    width: 100%;
  }
  #game {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;       /* fallback para navegadores viejos */
    height: 100dvh;      /* alto real visible, sin contar barra de direcciones */
  }
  #cargando {
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    padding-top: 40vh;
  }
</style>
</head>
<body>

<div id="cargando">Cargando emulador...</div>
<div id="game"></div>

<script>
  // ---------------------------------------------------------
  // CONFIGURACIÓN QUE DEBES AJUSTAR TÚ:
  // ---------------------------------------------------------

  // 1) Selección de juego según parámetro en la URL
  //    Ej: tusitio.com/jugar.html?id=pokemon
  const params = new URLSearchParams(window.location.search);
  const juegoId = params.get('id') || 'demo';

  // 2) Mapa de juegos: id -> ruta de la ROM
  //    Sube tus ROMs a tu propio hosting (mismo servidor, carpeta /roms/)
  const juegos = {
    demo:    { rom: 'roms/demo.gbc',    core: 'gambatte', nombre: 'Juego Demo' },
    // pokemon: { rom: 'roms/pokemon.gbc', core: 'gambatte', nombre: 'Pokemon' },
    // otro:    { rom: 'roms/otro.gbc',    core: 'gambatte', nombre: 'Otro juego' },
  };

  const juego = juegos[juegoId] || juegos['demo'];
  document.title = juego.nombre;

  // ---------------------------------------------------------
  // CONFIGURACIÓN DE EMULATORJS (no debería requerir más cambios)
  // ---------------------------------------------------------
  window.EJS_player = '#game';
  window.EJS_gameName = juego.nombre;
  window.EJS_biosUrl = '';
  window.EJS_gameUrl = juego.rom;
  window.EJS_core = juego.core; // 'gambatte' = Game Boy Color
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_backgroundColor = '#000000';
  window.EJS_startButtonName = 'Toca para jugar';
  window.EJS_alignStartButton = 'center';

  // IMPORTANTE: no forzamos autoarranque (EJS_startOnLoaded).
  // El navegador bloquea el audio hasta que hay un toque real del usuario,
  // así que dejamos que EmulatorJS muestre su botón de inicio propio.
  // Eso evita la pantalla en blanco/aleatoria de antes.

  // Layout de botones táctiles: dpad + A/B + Start/Select bien separados.
  // input_value según el estándar de EmulatorJS:
  // 0=A, 1=B(inferior), 2=Select, 3=Start, 4-7=dpad, 8=B, 9=Y
  window.EJS_VirtualGamepadSettings = [
    // D-pad a la izquierda
    { type: "dpad", location: "left", left: "20%", top: "50%", joystickInput: false, inputValues: [4, 5, 6, 7] },

    // Botones A/B a la derecha, estilo GBC (A arriba-derecha, B abajo-izquierda del grupo)
    { type: "button", text: "A", id: "a", location: "right", left: 75, top: 5, bold: true, input_value: 0 },
    { type: "button", text: "B", id: "b", location: "right", left: 30, top: 45, bold: true, input_value: 8 },

    // Start y Select centrados, un poco más arriba del borde inferior
    { type: "button", text: "Select", id: "select", location: "center", left: -18, top: 70, fontSize: 13, input_value: 2 },
    { type: "button", text: "Start", id: "start", location: "center", left: 18, top: 70, fontSize: 13, input_value: 3 }
  ];

  document.getElementById('cargando').remove();
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

<script>
  // Registrar service worker (necesario para que Chrome/Android ofrezca "instalar")
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.log('Service worker no registrado:', err);
    });
  }
</script>

</body>
</html>
